services:
  server:
    build:
      target: development
    environment:
      NODE_ENV: development
    command: npm run dev
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    restart: "no"

  client:
    build:
      target: development
    environment:
      VITE_API_URL: http://localhost:${SERVER_PORT:-3001}
      VITE_API_TOKEN: "${API_TOKEN:?Set API_TOKEN in the root .env file}"
    ports: !override
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173"]
    restart: "no"

volumes:
  server_node_modules:
  client_node_modules:
